force_keyboard_focus = true
selection_wrap = true
theme = "omarchy"
hide_action_hints = true

[placeholders]
"default" = { input = " Search apps and commands...", list = "No Results" }
"files" = { input = " Search files...", list = "No Files Found" }

[keybinds]
quick_activate = []

[providers]
max_results = 256
default = ["desktopapplications", "runner"]
empty = ["desktopapplications"]
